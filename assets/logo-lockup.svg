<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96">
  <!--
    The EQUZX lockup. The mark lives in the same 24x16 box the plugin draws it
    from (src/gui/widgets/glyph.rs, `logo`), scaled x4 here; keep the two in
    step when either changes. The wordmark is Mona Sans SemiBold, tracked wide,
    with system fallbacks for viewers without the font installed.
  -->
  <defs>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d9d"/>
      <stop offset="0.5" stop-color="#ff6fb0"/>
      <stop offset="1" stop-color="#ff4d9d"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffd3e4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd3e4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- mark: 24x16 design box at x4, centred vertically -->
  <g transform="translate(8 16) scale(4)">
    <line x1="1" y1="13.5" x2="23" y2="13.5" stroke="#ff4d9d" stroke-opacity="0.28"
          stroke-width="0.25" stroke-linecap="round"/>
    <path d="M 1 13.5 Q 9 13.5 12 3.5 Q 15 13.5 23 13.5"
          fill="none" stroke="url(#curve)" stroke-width="0.55" stroke-linecap="round"/>
    <circle cx="12" cy="3.5" r="2.6" fill="url(#halo)"/>
    <circle cx="12" cy="3.5" r="1.4" fill="#ffd3e4"/>
  </g>

  <!-- wordmark -->
  <text x="118" y="60" font-family="Mona Sans, Segoe UI, system-ui, sans-serif"
        font-size="34" font-weight="600" letter-spacing="7" fill="#ebebeb">EQUZX</text>
</svg>
